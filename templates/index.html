<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی ناسینەوەی دەموچاو - Face Recognition System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-person-bounding-box"></i>
                سیستەمی ناسینەوەی دەموچاو
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link text-white">
                            <i class="bi bi-people-fill"></i>
                            کەسی ناسراو: <span id="totalFaces" class="badge bg-light text-primary">{{ total_faces }}</span>
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <div class="row g-4">
            <!-- Left Panel - Training -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-cloud-upload"></i>
                            زیادکردنی دەموچاوی نوێ
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label class="form-label">ناوی کەس:</label>
                                <input type="text" class="form-control" id="personName" placeholder="ناوی کەس بنووسە..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">وێنە هەڵبژێرە:</label>
                                <input type="file" class="form-control" id="uploadImage" accept="image/*" required>
                            </div>
                            <div id="uploadPreview" class="mb-3 text-center" style="display: none;">
                                <img id="previewImg" class="img-fluid rounded border" style="max-height: 200px;">
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-check-circle"></i>
                                زیادکردن و فێربوون
                            </button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <h6 class="text-muted mb-3">دەموچاوە ناسراوەکان:</h6>
                        <div id="knownFacesList" class="list-group">
                            <div class="text-center text-muted py-3">
                                <i class="bi bi-inbox"></i>
                                هێشتا هیچ دەموچاوێک زیاد نەکراوە
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Panel - Webcam -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-camera-video"></i>
                            ناسینەوە لە وێبکام
                        </h5>
                    </div>
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <button id="startWebcam" class="btn btn-info btn-lg">
                                <i class="bi bi-play-circle"></i>
                                دەستپێکردن
                            </button>
                            <button id="stopWebcam" class="btn btn-danger btn-lg" style="display: none;">
                                <i class="bi bi-stop-circle"></i>
                                ڕاگرتن
                            </button>
                        </div>
                        
                        <div id="webcamContainer" class="position-relative" style="display: none;">
                            <video id="webcam" autoplay playsinline class="img-fluid rounded border"></video>
                            <canvas id="webcamCanvas" class="position-absolute top-0 start-0 w-100 h-100"></canvas>
                        </div>
                        
                        <div id="webcamStatus" class="alert alert-info mt-3" style="display: none;"></div>
                        
                        <div id="webcamResults" class="mt-3" style="display: none;">
                            <h6 class="text-muted mb-2">ئەنجامەکان:</h6>
                            <div id="webcamFaces"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Image Recognition -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">
                            <i class="bi bi-image"></i>
                            ناسینەوە لە وێنە
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="recognizeForm">
                            <div class="mb-3">
                                <label class="form-label">وێنە هەڵبژێرە بۆ ناسینەوە:</label>
                                <input type="file" class="form-control" id="recognizeImage" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 text-dark">
                                <i class="bi bi-search"></i>
                                ناسینەوە
                            </button>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div id="recognitionResult" style="display: none;">
                            <h6 class="text-muted mb-3">ئەنجام:</h6>
                            <div id="resultImage" class="mb-3 text-center"></div>
                            <div id="resultDetails"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificationToast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-bell-fill me-2"></i>
                <strong class="me-auto">ئاگاداری</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-white">چاوەڕوان بە...</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
